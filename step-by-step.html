<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI美食海报生成器 - 分步优化</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f97316;
            --primary-dark: #ea580c;
            --accent: #fb923c;
            --bg-dark: #0c0a09;
            --bg-card: #1c1917;
            --bg-input: #292524;
            --text-primary: #fafaf9;
            --text-secondary: #a8a29e;
            --border: #44403c;
            --success: #22c55e;
            --warning: #eab308;
        }
        
        * {
            font-family: 'Noto Sans SC', sans-serif;
            box-sizing: border-box;
        }
        
        body {
            background: var(--bg-dark);
            background-image: 
                radial-gradient(ellipse at top left, rgba(249, 115, 22, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at bottom right, rgba(251, 146, 60, 0.05) 0%, transparent 50%);
            min-height: 100vh;
        }
        
        .gradient-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            transition: all 0.3s ease;
        }
        
        .gradient-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(249, 115, 22, 0.4);
        }
        
        .gradient-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .input-field {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-primary);
            transition: all 0.2s ease;
        }
        
        .input-field:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.2);
        }
        
        .input-field::placeholder {
            color: var(--text-secondary);
        }
        
        .step-indicator {
            transition: all 0.3s ease;
        }
        
        .step-indicator.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            transform: scale(1.1);
        }
        
        .step-indicator.completed {
            background: var(--success);
            color: white;
        }
        
        .step-indicator.pending {
            background: var(--bg-input);
            color: var(--text-secondary);
        }
        
        .progress-bar {
            background: var(--bg-input);
            overflow: hidden;
        }
        
        .progress-fill {
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
            transition: width 0.5s ease;
        }
        
        .result-image {
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .loading-pulse {
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        .spinner {
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .glass-card {
            background: rgba(28, 25, 23, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
        }
        
        .admin-badge {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        
        .step-card {
            transition: all 0.3s ease;
        }
        
        .step-card.active {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(249, 115, 22, 0.2);
        }
        
        .scrollbar-thin::-webkit-scrollbar {
            width: 6px;
        }
        
        .scrollbar-thin::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
    </style>
</head>

- 字体选择与整体风格协调
- 最终呈现为一张完整的美食营销海报
输出：仅输出优化后的图片生成提示词，不要其他解释。`
        };
        
        let config = {
            apiKey: 'sk-1bc9a6de33214a72be42a2bd5738310c',
            imageModel: 'wan2.7-image-pro',
            llmModel: 'qwen-plus',
            stepPrompts: { ...DEFAULT_STEP_PROMPTS }
        };
        
        let processImages = [];
        let isGenerating = false;
        
        const elements = {
            dishName: document.getElementById('dishName'),
            dishDesc: document.getElementById('dishDesc'),
            styleSelect: document.getElementById('styleSelect'),
            marketingText: document.getElementById('marketingText'),
            generateBtn: document.getElementById('generateBtn'),
            progressFill: document.getElementById('progressFill'),
            emptyState: document.getElementById('emptyState'),
            loadingState: document.getElementById('loadingState'),
            loadingText: document.getElementById('loadingText'),
            resultState: document.getElementById('resultState'),
            resultImage: document.getElementById('resultImage'),
            downloadBtn: document.getElementById('downloadBtn'),
            regenerateBtn: document.getElementById('regenerateBtn'),
            errorState: document.getElementById('errorState'),
            errorText: document.getElementById('errorText'),
            retryBtn: document.getElementById('retryBtn'),
            adminBtn: document.getElementById('adminBtn'),
            connectionStatus: document.getElementById('connectionStatus'),
            adminModal: document.getElementById('adminModal'),
            adminOverlay: document.getElementById('adminOverlay'),
            closeAdmin: document.getElementById('closeAdmin'),
            adminApiKey: document.getElementById('adminApiKey'),
            adminImageModel: document.getElementById('adminImageModel'),
            adminLlmModel: document.getElementById('adminLlmModel'),
            saveAdminConfig: document.getElementById('saveAdminConfig'),
            processImages: document.getElementById('processImages'),
            step1Prompt: document.getElementById('step1Prompt'),
            step2Prompt: document.getElementById('step2Prompt'),
            step3Prompt: document.getElementById('step3Prompt'),
            step4Prompt: document.getElementById('step4Prompt'),
            step5Prompt: document.getElementById('step5Prompt'),
            savePrompts: document.getElementById('savePrompts')
        };
        
        function loadConfig() {
            const saved = localStorage.getItem('food_poster_config');
            if (saved) {
                config = { ...config, ...JSON.parse(saved) };
            }
            applyConfig();
        }
        
        function saveConfig() {
            localStorage.setItem('food_poster_config', JSON.stringify(config));
        }
        
        function applyConfig() {
            elements.adminApiKey.value = config.apiKey;
            elements.adminImageModel.value = config.imageModel;
            elements.adminLlmModel.value = config.llmModel;
            elements.step1Prompt.value = config.stepPrompts.step1;
            elements.step2Prompt.value = config.stepPrompts.step2;
            elements.step3Prompt.value = config.stepPrompts.step3;
            elements.step4Prompt.value = config.stepPrompts.step4;
            elements.step5Prompt.value = config.stepPrompts.step5;
        }
        
        function updateStepStatus(step, status) {
            const card = document.querySelector(`[data-step="${step}"]`);
            const indicator = card.querySelector('.step-indicator');
            const statusText = card.querySelector('.step-status');
            
            indicator.className = 'step-indicator w-8 h-8 rounded-full flex items-center justify-center text-sm font-medium';
            
            if (status === 'active') {
                indicator.classList.add('active');
                statusText.textContent = '处理中...';
                statusText.className = 'step-status text-xs text-orange-400';
                card.classList.add('active');
            } else if (status === 'completed') {
                indicator.classList.add('completed');
                statusText.textContent = '已完成';
                statusText.className = 'step-status text-xs text-green-400';
                card.classList.remove('active');
            } else {
                indicator.classList.add('pending');
                statusText.textContent = '等待中';
                statusText.className = 'step-status text-xs text-stone-500';
                card.classList.remove('active');
            }
        }
        
        function resetSteps() {
            for (let i = 1; i <= 5; i++) {
                updateStepStatus(i, 'pending');
            }
            elements.progressFill.style.width = '0%';
        }
        
        async function optimizePrompt(step, input, previousImage = null) {
            const systemPrompt = config.stepPrompts[`step${step}`];
            
            const messages = [
                { role: 'system', content: systemPrompt },
                { role: 'user', content: input }
            ];
            
            const response = await fetch(LLM_API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${config.apiKey}`
                },
                body: JSON.stringify({
                    model: config.llmModel,
                    messages: messages,
                    temperature: 0.7,
                    max_tokens: 1000
                })
            });
            
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error?.message || '优化失败');
            }
            
            return data.choices[0].message.content.trim();
        }
        
        async function generateImage(prompt, referenceImage = null) {
            const content = [{ text: prompt }];
            
            if (referenceImage) {
                content.push({ image: referenceImage });
            }
            
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${config.apiKey}`
                },
                body: JSON.stringify({
                    model: config.imageModel,
                    input: {
                        messages: [{
                            role: 'user',
                            content: content
                        }]
                    },
                    parameters: {
                        size: '2K',
                        n: 1,
                        watermark: false
                    }
                })
            });
            
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.message || '生成失败');
            }
            
            const imageContent = data.output.choices[0].message.content.find(c => c.type === 'image');
            return imageContent ? imageContent.image : null;
        }
        
        async function startGeneration() {
            const dishName = elements.dishName.value.trim();
            if (!dishName) {
                alert('请输入菜品名称');
                return;
            }
            
            if (isGenerating) return;
            isGenerating = true;
            
            const dishDesc = elements.dishDesc.value.trim();
            const style = elements.styleSelect.value;
            const marketingText = elements.marketingText.value.trim();
            
            const userInput = `菜品名称：${dishName}${dishDesc ? '，描述：' + dishDesc : ''}${style !== 'default' ? '，风格：' + style : ''}${marketingText ? '，营销文案：' + marketingText : ''}`;
            
            elements.emptyState.classList.add('hidden');
            elements.resultState.classList.add('hidden');
            elements.errorState.classList.add('hidden');
            elements.loadingState.classList.remove('hidden');
            elements.generateBtn.disabled = true;
            
            resetSteps();
            processImages = [];
            
            let currentImage = null;
            let currentPrompt = userInput;
            
            const stepNames = [
                '菜品主体生成中...',
                '场景环境优化中...',
                '光影构图优化中...',
                '画风质感优化中...',
                '文案排版中...'
            ];
            
            try {
                for (let step = 1; step <= 5; step++) {
                    updateStepStatus(step, 'active');
                    elements.loadingText.textContent = stepNames[step - 1];
                    elements.progressFill.style.width = `${(step - 0.5) * 20}%`;
                    
                    const optimizedPrompt = await optimizePrompt(step, currentPrompt, currentImage);
                    
                    elements.progressFill.style.width = `${(step - 0.2) * 20}%`;
                    
                    currentImage = await generateImage(optimizedPrompt, currentImage);
                    
                    if (!currentImage) {
                        throw new Error(`步骤${step}生成失败`);
                    }
                    
                    processImages.push({
                        step: step,
                        name: ['菜品主体', '场景环境', '光影构图', '画风质感', '成品海报'][step - 1],
                        url: currentImage,
                        prompt: optimizedPrompt
                    });
                    
                    currentPrompt = optimizedPrompt;
                    updateStepStatus(step, 'completed');
                    elements.progressFill.style.width = `${step * 20}%`;
                }
                
                elements.resultImage.src = currentImage;
                elements.downloadBtn.href = currentImage;
                elements.loadingState.classList.add('hidden');
                elements.resultState.classList.remove('hidden');
                
                updateProcessImagesDisplay();
                
            } catch (error) {
                elements.loadingState.classList.add('hidden');
                elements.errorState.classList.remove('hidden');
                elements.errorText.textContent = error.message;
            } finally {
                isGenerating = false;
                elements.generateBtn.disabled = false;
            }
        }
        
        function updateProcessImagesDisplay() {
            if (processImages.length === 0) {
                elements.processImages.innerHTML = '<p class="text-stone-500 text-sm">生成后可在此查看各步骤中间图</p>';
                return;
            }
            
            elements.processImages.innerHTML = processImages.map(img => `
                <div class="bg-stone-900/50 rounded-xl p-3">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm font-medium">步骤${img.step}: ${img.name}</span>
                        <a href="${img.url}" download="step${img.step}.png" class="text-xs text-orange-400 hover:text-orange-300">下载</a>
                    </div>
                    <img src="${img.url}" class="w-full rounded-lg mb-2" alt="步骤${img.step}">
                    <details class="text-xs">
                        <summary class="text-stone-400 cursor-pointer hover:text-stone-300">查看提示词</summary>
                        <p class="mt-2 text-stone-500 p-2 bg-stone-800 rounded">${img.prompt}</p>
                    </details>
                </div>
            `).join('');
        }
        
        async function testConnection() {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${config.apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'wan2.7-image',
                        input: {
                            messages: [{
                                role: 'user',
                                content: [{ text: 'test' }]
                            }]
                        }
                    })
                });
                
                if (response.ok || response.status === 400) {
                    elements.connectionStatus.className = 'text-xs px-3 py-1 rounded-full bg-green-500/20 text-green-400';
                    elements.connectionStatus.textContent = '已连接';
                } else {
                    elements.connectionStatus.className = 'text-xs px-3 py-1 rounded-full bg-red-500/20 text-red-400';
                    elements.connectionStatus.textContent = '连接失败';
                }
            } catch (error) {
                elements.connectionStatus.className = 'text-xs px-3 py-1 rounded-full bg-red-500/20 text-red-400';
                elements.connectionStatus.textContent = '连接失败';
            }
        }
        
        elements.generateBtn.addEventListener('click', startGeneration);
        elements.regenerateBtn.addEventListener('click', startGeneration);
        elements.retryBtn.addEventListener('click', startGeneration);
        
        elements.adminBtn.addEventListener('click', () => {
            elements.adminModal.classList.remove('hidden');
        });
        
        elements.closeAdmin.addEventListener('click', () => {
            elements.adminModal.classList.add('hidden');
        });
        
        elements.adminOverlay.addEventListener('click', () => {
            elements.adminModal.classList.add('hidden');
        });
        
        elements.saveAdminConfig.addEventListener('click', () => {
            config.apiKey = elements.adminApiKey.value;
            config.imageModel = elements.adminImageModel.value;
            config.llmModel = elements.adminLlmModel.value;
            saveConfig();
            testConnection();
            alert('配置已保存');
        });
        
        elements.savePrompts.addEventListener('click', () => {
            config.stepPrompts.step1 = elements.step1Prompt.value;
            config.stepPrompts.step2 = elements.step2Prompt.value;
            config.stepPrompts.step3 = elements.step3Prompt.value;
            config.stepPrompts.step4 = elements.step4Prompt.value;
            config.stepPrompts.step5 = elements.step5Prompt.value;
            saveConfig();
            alert('提示词模板已保存');
        });
        
        loadConfig();
        testConnection();
    </script>
</body>
</html>
