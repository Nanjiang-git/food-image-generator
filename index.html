<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿里云万相 - AI图片对话生成</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --accent: #8b5cf6;
            --bg-dark: #0a0a0f;
            --bg-sidebar: #0f0f18;
            --bg-chat: #12121c;
            --bg-input: #1a1a28;
            --bg-message-user: #1e1e30;
            --bg-message-ai: #18182a;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #2d2d4a;
        }
        
        * {
            font-family: 'Noto Sans SC', sans-serif;
            box-sizing: border-box;
        }
        
        body {
            background: var(--bg-dark);
            min-height: 100vh;
            overflow: hidden;
        }
        
        .scrollbar-thin::-webkit-scrollbar {
            width: 6px;
        }
        
        .scrollbar-thin::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        
        .scrollbar-thin::-webkit-scrollbar-thumb:hover {
            background: #3d3d5a;
        }
        
        .chat-container {
            height: calc(100vh - 180px);
        }
        
        .message-user {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(139, 92, 246, 0.15) 100%);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }
        
        .message-ai {
            background: var(--bg-message-ai);
            border: 1px solid var(--border);
        }
        
        .input-area {
            background: linear-gradient(to top, var(--bg-dark) 0%, transparent 100%);
        }
        
        .gradient-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            transition: all 0.3s ease;
        }
        
        .gradient-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.4);
        }
        
        .gradient-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .input-field {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-primary);
            transition: all 0.2s ease;
        }
        
        .input-field:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
        
        .input-field::placeholder {
            color: var(--text-secondary);
        }
        
        .session-item {
            transition: all 0.2s ease;
        }
        
        .session-item:hover {
            background: rgba(99, 102, 241, 0.1);
        }
        
        .session-item.active {
            background: rgba(99, 102, 241, 0.2);
            border-left: 3px solid var(--primary);
        }
        
        .typing-indicator span {
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        @keyframes fadeInUp {
            from { 
                opacity: 0; 
                transform: translateY(10px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }
        
        .message-animate {
            animation: fadeInUp 0.3s ease;
        }
        
        @keyframes pulse-border {
            0%, 100% { border-color: var(--primary); }
            50% { border-color: var(--accent); }
        }
        
        .generating {
            animation: pulse-border 1.5s ease-in-out infinite;
        }
        
        .preview-thumb {
            max-height: 80px;
            max-width: 120px;
            object-fit: cover;
            border-radius: 8px;
        }
        
        .generated-image {
            max-height: 350px;
            object-fit: contain;
            border-radius: 12px;
        }
        
        .icon-btn {
            transition: all 0.2s ease;
        }
        
        .icon-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
        }
        
        .modal-overlay {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
        }
        
        .settings-panel {
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
        }
        
        .prompt-compare {
            background: rgba(99, 102, 241, 0.1);
            border: 1px dashed var(--primary);
        }
        
        .tab-btn-active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
        }
        
        .admin-badge {
            background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
        }
    </style>
</head>
<body class="text-slate-100">

    <script>
        const API_URL = 'https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation';
        const LLM_API_URL = 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions';
        
        const DEFAULT_PROMPT_RULES = `# 角色
你是一位专业的AI绘图提示词优化师，专注于将用户输入的抽象或模糊文字提示词优化为精准、具象且富有细节的图像生成提示，帮助用户提升提示词质量，助力生成高质量、符合预期的实物图像。

## 技能
### 技能 1: 提示词细节具象化优化
- **目标**：将用户输入的简洁提示词（如"一碗面"）转化为包含材质、形态、动态的具体描述，让图像生成更精准。
- **方法**：拆解提示词核心元素（如主体、数量、场景），补充细节：
  - 材质细节：如"粗陶碗""玻璃盘""木质托盘"；

        function formatDate(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return `${Math.floor(diff / 60000)}分钟前`;
            if (diff < 86400000) return `${Math.floor(diff / 3600000)}小时前`;
            if (diff < 604800000) return `${Math.floor(diff / 86400000)}天前`;
            
            return date.toLocaleDateString('zh-CN');
        }

        function scrollToBottom() {

        function addMessage(role, content) {
            const session = getCurrentSession();
            if (!session) return;
            
            const message = {
                id: generateId(),
                role,
                ...content,
                timestamp: Date.now()
            };
            
            session.messages.push(message);
            
            if (role === 'user' && session.messages.length === 1) {
                session.title = content.text.substring(0, 20) + (content.text.length > 20 ? '...' : '');
                renderSessionList();
            }
            
            saveToStorage();
            renderMessages();
        }

        function updateLastMessage(content) {
            const session = getCurrentSession();
            if (!session || session.messages.length === 0) return;
            
            const lastMsg = session.messages[session.messages.length - 1];
            Object.assign(lastMsg, content);
            saveToStorage();
            renderMessages();
        }

        async function optimizePrompt(userPrompt) {
            if (!adminSettings.enableOptimization) {
                return userPrompt;
            }
            
            const response = await fetch(LLM_API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${settings.apiKey}`
                },
                body: JSON.stringify({
                    model: adminSettings.optimizerModel,
                    messages: [
                        { role: 'system', content: adminSettings.promptRules },
                        { role: 'user', content: userPrompt }
                    ],
                    temperature: 0.7,
                    max_tokens: 1000
                })
            });
            
            const data = await response.json();
            
            if (!response.ok) {
                throw new Error(data.error?.message || `优化失败: HTTP ${response.status}`);
            }
            
            return data.choices[0].message.content.trim();
        }

        async function generateImage(prompt, images = []) {
            const content = [];
            content.push({ text: prompt });
            
            images.forEach(img => {
                content.push({ image: img });
            });
            
            const requestBody = {
                model: settings.model,
                input: {
                    messages: [{
                        role: 'user',
                        content: content
                    }]
                },
                parameters: {
                    size: settings.size,
                    n: settings.count,
                    watermark: false
                }
            };
            
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${settings.apiKey}`
                },
                body: JSON.stringify(requestBody)
            });
            
            const data = await response.json();
            
            if (!response.ok) {
                throw new Error(data.message || `HTTP ${response.status}`);
            }
            
            return data;
        }

        async function sendMessage() {
            const text = elements.messageInput.value.trim();
            const images = [...pendingImages];
            
            if (!text && images.length === 0) return;
            if (isGenerating) return;
            
            if (!currentSessionId) {
                createSession();
            }
            
            addMessage('user', { text, images });
            
            elements.messageInput.value = '';
            elements.charCounter.textContent = '0 / 5000';
            clearImagePreviews();
            updateSendButton();
            
            isGenerating = true;
            elements.sendBtn.disabled = true;
            
            let optimizedPrompt = text;
            
            if (adminSettings.enableOptimization && text) {
                addMessage('assistant', { isOptimizing: true });
                
                try {
                    optimizedPrompt = await optimizePrompt(text);
                    updateLastMessage({ isOptimizing: false, isGenerating: true });
                } catch (error) {
                    updateLastMessage({
                        isOptimizing: false,
                        error: `提示词优化失败: ${error.message}，将使用原始提示词生成`
                    });
                    optimizedPrompt = text;
                    addMessage('assistant', { isGenerating: true });
                }
            } else {
                addMessage('assistant', { isGenerating: true });
            }
            
            try {
                const result = await generateImage(optimizedPrompt, images);
                
                const generatedImages = result.output.choices.map(choice => {
                    const imgContent = choice.message.content.find(c => c.type === 'image');
                    return imgContent ? { url: imgContent.image } : null;
                }).filter(Boolean);
                
                updateLastMessage({
                    isGenerating: false,
                    images: generatedImages,
                    optimizedPrompt: adminSettings.enableOptimization && text !== optimizedPrompt ? optimizedPrompt : null,
                    text: `已生成 ${generatedImages.length} 张图片`,
                    size: result.usage?.size
                });
                
            } catch (error) {
                updateLastMessage({
                    isGenerating: false,
                    error: error.message
                });
            } finally {
                isGenerating = false;
                updateSendButton();
            }
        }

        function updateSendButton() {
            const hasContent = elements.messageInput.value.trim() || pendingImages.length > 0;
            elements.sendBtn.disabled = !hasContent || isGenerating;
        }

                reader.readAsDataURL(file);

            } finally {
                elements.testConnectionBtn.disabled = false;
                elements.testConnectionBtn.textContent = '测试连接';
            }
        }

        elements.newSessionBtn.addEventListener('click', createSession);

        elements.settingsBtn.addEventListener('click', () => {
            elements.settingsModal.classList.remove('hidden');
        });

        elements.closeSettings.addEventListener('click', () => {
            elements.settingsModal.classList.add('hidden');
        });

        elements.modalOverlay.addEventListener('click', () => {
            elements.settingsModal.classList.add('hidden');
        });

        elements.saveSettingsBtn.addEventListener('click', () => {
            settings.apiKey = elements.apiKeyInput.value;
            settings.model = elements.modelSelect.value;
            settings.size = elements.sizeSelect.value;
            settings.count = parseInt(elements.countSelect.value);
            
            elements.currentModelBadge.textContent = settings.model;
            saveToStorage();
            elements.settingsModal.classList.add('hidden');
        });

        elements.testConnectionBtn.addEventListener('click', testConnection);

        elements.adminBtn.addEventListener('click', () => {
            elements.adminModal.classList.remove('hidden');
        });

        elements.closeAdmin.addEventListener('click', () => {
            elements.adminModal.classList.add('hidden');
        });

        elements.adminOverlay.addEventListener('click', () => {
            elements.adminModal.classList.add('hidden');
        });

        document.querySelectorAll('[data-admin-tab]').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.adminTab;
                
                document.querySelectorAll('[data-admin-tab]').forEach(b => {
                    b.className = 'px-4 py-2 rounded-lg text-sm font-medium bg-slate-700 hover:bg-slate-600';
                });
                btn.className = 'tab-btn-active px-4 py-2 rounded-lg text-sm font-medium';
                
                document.querySelectorAll('.admin-tab-content').forEach(content => {
                    content.classList.add('hidden');
                });
                document.getElementById(tab + 'Tab').classList.remove('hidden');
            });
        });

        elements.resetPromptRules.addEventListener('click', () => {
            elements.promptRules.value = DEFAULT_PROMPT_RULES;
        });

        elements.savePromptRules.addEventListener('click', () => {
            adminSettings.enableOptimization = elements.enableOptimization.checked;
            adminSettings.optimizerModel = elements.optimizerModel.value;
            adminSettings.promptRules = elements.promptRules.value;
            saveToStorage();
            alert('提示词优化规则已保存');
        });

        elements.testOptimizeBtn.addEventListener('click', async () => {
            const testPrompt = prompt('请输入测试提示词:', '一碗面');
            if (!testPrompt) return;
            
            elements.testOptimizeBtn.disabled = true;
            elements.testOptimizeBtn.textContent = '测试中...';
            
            try {
                const optimized = await optimizePrompt(testPrompt);
                elements.testOptimizeResult.classList.remove('hidden');
                elements.testOptimizeResult.querySelector('div').innerHTML = `
                    <p class="text-slate-400 mb-2">原始提示词：</p>
                    <p class="text-slate-300 mb-4">${testPrompt}</p>
                    <p class="text-slate-400 mb-2">优化后：</p>
                    <p class="text-indigo-300">${optimized}</p>
                `;
            } catch (error) {
                alert('测试失败: ' + error.message);
            } finally {
                elements.testOptimizeBtn.disabled = false;
                elements.testOptimizeBtn.textContent = '测试优化';
            }
        });

        elements.saveModelConfig.addEventListener('click', () => {
            adminSettings.defaultImageModel = elements.defaultImageModel.value;
            adminSettings.defaultSize = elements.defaultSize.value;
            adminSettings.defaultCount = parseInt(elements.defaultCount.value);
            
            settings.model = adminSettings.defaultImageModel;
            settings.size = adminSettings.defaultSize;
            settings.count = adminSettings.defaultCount;
            
            applySettings();
            saveToStorage();
            alert('模型配置已保存');
        });

        elements.uploadImageBtn.addEventListener('click', () => {
            elements.imageInput.click();
        });

        elements.imageInput.addEventListener('change', (e) => {
            handleImageUpload(e.target.files);
            e.target.value = '';
        });

        elements.messageInput.addEventListener('input', () => {
            const len = elements.messageInput.value.length;
            elements.charCounter.textContent = `${len} / 5000`;
            
            elements.messageInput.style.height = 'auto';
            elements.messageInput.style.height = Math.min(elements.messageInput.scrollHeight, 150) + 'px';
            
            updateSendButton();
        });

        elements.messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        elements.sendBtn.addEventListener('click', sendMessage);

        document.querySelectorAll('.quick-prompt').forEach((btn, index) => {
            btn.addEventListener('click', () => {
                const prompts = [
                    '一只可爱的橘猫坐在窗台上，阳光透过窗户洒在它身上，温馨的室内场景',
                    '请先上传一张图片，然后描述你想要如何编辑它',
                    '请先上传一张图片，我将帮你转换为油画风格',
                    '请上传多张图片，我将帮你融合它们的特点'
                ];
                elements.messageInput.value = prompts[index];
                elements.messageInput.dispatchEvent(new Event('input'));
                elements.messageInput.focus();
            });
        });

        elements.chatContainer.addEventListener('dragover', (e) => {
            e.preventDefault();
            elements.chatContainer.classList.add('generating');
        });

        elements.chatContainer.addEventListener('dragleave', () => {
            elements.chatContainer.classList.remove('generating');
        });

        elements.chatContainer.addEventListener('drop', (e) => {
            e.preventDefault();
            elements.chatContainer.classList.remove('generating');
            handleImageUpload(e.dataTransfer.files);
        });

        loadFromStorage();
        testConnection();
    </script>
</body>
</html>
